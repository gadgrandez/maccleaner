[workspace]
resolver = "3"
members = ["crates/core", "crates/ffi", "crates/monitor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
maccleaner-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
plist = { version = "1", default-features = false }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSString", "NSError"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
